  "/products/{productId}": 
    "get": 
      "tags": 
        - "Products"
      "operationId": "getProduct"
      "summary": "Retrieve a product"
      "description": "Retrieve current pricing and availability. A matching If-None-Match value returns 304 without a body.\n\nAccess: Public. All unknown request properties are rejected. Demo data resets on server restart. Error examples are illustrative envelopes for the documented category, not captured failed requests. Exact detail and fields depend on the failing condition."
      "security": []
      "parameters": 
        - "name": "productId"
          "in": "path"
          "required": true
          "description": "Opaque productId identifier."
          "schema": 
            "type": "string"
            "minLength": 1
          "example": "prod_1001"
        - "name": "If-None-Match"
          "in": "header"
          "description": "Previously received ETag. A match returns 304 without a body."
          "schema": 
            "type": "string"
        - "name": "X-Demo-Error"
          "in": "header"
          "description": "Optional deterministic lab trigger. rate-limit returns 429 with Retry-After: 5. This is not a real quota system."
          "schema": 
            "type": "string"
            "enum": 
              - "rate-limit"
      "responses": 
        "200": 
          "description": "Successful operation."
          "content": 
            "application/json": 
              "schema": 
                "$ref": "#/components/schemas/Product"
              "example": 
                "id": "prod_1001"
                "name": "Wireless Headphones"
                "description": "Over-ear wireless headphones with a travel case."
                "sku": "WH-BLK-01"
                "price": 
                  "amountMinor": 249900
                  "currency": "INR"
                "priceBeforeMarkdown": 
                  "amountMinor": 299900
                  "currency": "INR"
                "availability": "IN_STOCK"
                "categoryId": "cat_audio"
                "sellerId": "seller_1001"
                "createdAt": "2026-01-15T09:00:00.000Z"
          "headers": 
            "ETag": 
              "description": "Opaque representation validator."
              "schema": 
                "type": "string"
            "Cache-Control": 
              "schema": 
                "type": "string"
              "description": "private, max-age=0, must-revalidate"
        "304": 
          "description": "Representation unchanged. No body."
          "headers": 
            "ETag": 
              "schema": 
                "type": "string"
              "description": "Current representation validator."
        "400": 
          "description": "Check required fields, data types, and documented limits."
          "content": 
