          "type": "string"
          "description": "Product display name."
          "minLength": 1
          "maxLength": 120
        "description": 
          "type": "string"
          "description": "Changes only when supplied."
          "maxLength": 2000
        "sku": 
          "type": "string"
          "description": "Unique product SKU."
          "minLength": 1
          "maxLength": 64
        "price": 
