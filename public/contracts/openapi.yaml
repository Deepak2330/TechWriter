"components": 
  "schemas": 
    "Money": 
      "type": "object"
      "description": "Integer minor units plus explicit currency. INR has 100 minor units per rupee. Other currencies may have different scales."
      "properties": 
        "amountMinor": 
          "type": "integer"
          "minimum": 0
          "maximum": 2147483647
        "currency": 
          "type": "string"
          "description": "ISO currency identifier; demo supports INR only."
          "enum": 
            - "INR"
      "required": 
        - "amountMinor"
        - "currency"
      "additionalProperties": false
    "MoneyInput": 
      "type": "object"
      "description": ""
      "properties": 
        "amountMinor": 
          "type": "integer"
          "minimum": 0
          "maximum": 1000000
          "description": "Nonnegative integer minor units. Unit prices are capped to keep demo totals within GraphQL Int."
        "currency": 
          "type": "string"
          "description": "Demo supports INR only."
          "enum": 
            - "INR"
      "required": 
        - "amountMinor"
        - "currency"
      "additionalProperties": false
    "ProductInput": 
      "type": "object"
      "description": ""
      "properties": 
        "name": 
          "type": "string"
          "description": "Product display name."
          "minLength": 1
          "maxLength": 120
        "description": 
          "type": "string"
          "description": "Long description. Omitted on create/replace: empty string."
          "maxLength": 2000
          "default": ""
        "sku": 
          "type": "string"
          "description": "Unique product SKU."
          "minLength": 1
          "maxLength": 64
        "price": 
          "$ref": "#/components/schemas/MoneyInput"
        "priceBeforeMarkdown": 
          "description": "Original price before markdown. May be null; otherwise at least the current price. Omitted on create/replace: null."
          "anyOf": 
            - "$ref": "#/components/schemas/MoneyInput"
            - "type": "null"
          "default": null
        "availability": 
          "type": "string"
          "description": "Whether the demo accepts new cart additions."
          "enum": 
            - "IN_STOCK"
            - "OUT_OF_STOCK"
        "categoryId": 
          "type": "string"
          "description": "Existing category ID; see GET /categories."
      "required": 
        - "name"
        - "sku"
        - "price"
        - "availability"
        - "categoryId"
      "additionalProperties": false
    "ProductPatch": 
      "type": "object"
      "description": "Omitted fields remain unchanged. Supply at least one field. This is not JSON Patch."
