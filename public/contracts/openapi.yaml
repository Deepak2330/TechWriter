"openapi": "3.1.1"
"info": 
  "title": "ShopVerse Learning API"
  "version": "1.0.0"
  "summary": "Fictional e-commerce API for technical writing practice."
  "description": "Educational local demo only. Not an official Amazon or Flipkart API. Data is synthetic and stored in memory. Run npm install and npm run dev. Demo tokens are fixed local credentials, not production OAuth. Prices use integer INR minor units. Tax, shipping charges, payment processing, automatic fulfilment, and stock reservation are not implemented."
  "license": 
    "name": "MIT"
    "identifier": "MIT"
"servers": 
  - "url": "/api/v1"
    "description": "Same-origin local learning server"
"tags": 
  - "name": "Products"
    "description": "ShopVerse products learning operations."
  - "name": "Reviews"
    "description": "ShopVerse reviews learning operations."
  - "name": "Customers"
    "description": "ShopVerse customers learning operations."
  - "name": "Carts"
    "description": "ShopVerse carts learning operations."
  - "name": "Orders"
    "description": "ShopVerse orders learning operations."
  - "name": "Returns"
    "description": "ShopVerse returns learning operations."
"paths": 
  "/products": 
    "get": 
      "tags": 
        - "Products"
      "operationId": "listProducts"
      "summary": "Search the product catalogue"
      "description": "Filter by name, category, or availability. Results default to NAME_ASC and use offset pagination.\n\nAccess: Public. All unknown request properties are rejected. Demo data resets on server restart. Error examples are illustrative envelopes for the documented category, not captured failed requests. Exact detail and fields depend on the failing condition."
      "security": []
      "parameters": 
        - "name": "limit"
          "in": "query"
          "description": "Maximum items in this page."
          "schema": 
            "type": "integer"
            "default": 20
            "minimum": 1
            "maximum": 100
        - "name": "offset"
          "in": "query"
          "description": "Zero-based position to begin reading."
          "schema": 
            "type": "integer"
            "default": 0
            "minimum": 0
            "maximum": 1000000
        - "name": "q"
          "description": "Case-insensitive name substring."
          "schema": 
            "type": "string"
            "minLength": 1
            "maxLength": 120
          "in": "query"
        - "name": "categoryId"
          "description": "Exact category identifier."
          "schema": 
            "type": "string"
            "minLength": 1
            "maxLength": 120
          "in": "query"
        - "name": "availability"
          "description": "Exact availability value."
          "schema": 
            "type": "string"
            "enum": 
              - "IN_STOCK"
              - "OUT_OF_STOCK"
          "in": "query"
        - "name": "sort"
          "description": "Stable sort with ID tie-breaker."
          "schema": 
            "type": "string"
            "enum": 
              - "NAME_ASC"
              - "PRICE_ASC"
              - "PRICE_DESC"
            "default": "NAME_ASC"
          "in": "query"
        - "name": "X-Demo-Error"
          "in": "header"
          "description": "Optional deterministic lab trigger. rate-limit returns 429 with Retry-After: 5. This is not a real quota system."
          "schema": 
            "type": "string"
            "enum": 
              - "rate-limit"
      "responses": 
        "200": 
          "description": "Successful operation."
          "content": 
            "application/json": 
              "schema": 
                "$ref": "#/components/schemas/ProductPage"
              "example": 
                "items": 
                  - "id": "prod_1003"
                    "name": "Canvas Backpack"
                    "description": "A lightweight everyday backpack."
                    "sku": "CB-GRY-01"
                    "price": 
                      "amountMinor": 189900
                      "currency": "INR"
                    "priceBeforeMarkdown": null
                    "availability": "OUT_OF_STOCK"
                    "categoryId": "cat_accessories"
                    "sellerId": "seller_1002"
                    "createdAt": "2026-01-15T09:00:00.000Z"
                  - "id": "prod_1002"
                    "name": "Desk Lamp"
                    "description": "Adjustable reading lamp with a warm white light."
                    "sku": "DL-WHT-01"
                    "price": 
                      "amountMinor": 129900
                      "currency": "INR"
                    "priceBeforeMarkdown": null
                    "availability": "IN_STOCK"
                    "categoryId": "cat_home"
                    "sellerId": "seller_1001"
                    "createdAt": "2026-01-15T09:00:00.000Z"
                  - "id": "prod_1001"
                    "name": "Wireless Headphones"
                    "description": "Over-ear wireless headphones with a travel case."
                    "sku": "WH-BLK-01"
                    "price": 
                      "amountMinor": 249900
                      "currency": "INR"
                    "priceBeforeMarkdown": 
                      "amountMinor": 299900
                      "currency": "INR"
                    "availability": "IN_STOCK"
                    "categoryId": "cat_audio"
                    "sellerId": "seller_1001"
                    "createdAt": "2026-01-15T09:00:00.000Z"
                "total": 3
                "limit": 20
                "offset": 0
        "400": 
          "description": "Check required fields, data types, and documented limits."
          "content": 
            "application/problem+json": 
              "schema": 
                "$ref": "#/components/schemas/Problem"
              "example": 
                "type": "about:blank"
                "title": "Bad Request"
                "status": 400
                "detail": "Check required fields, data types, and documented limits."
                "instance": "/api/v1/products"
                "code": "INVALID_INPUT"
                "fields": []
        "404": 
          "description": "The requested resource was not found."
          "content": 
            "application/problem+json": 
              "schema": 
                "$ref": "#/components/schemas/Problem"
              "example": 
                "type": "about:blank"
                "title": "Not Found"
                "status": 404
                "detail": "The requested resource was not found."
                "instance": "/api/v1/products"
                "code": "NOT_FOUND"
                "fields": []
        "429": 
          "description": "Remove the deterministic lab header or retry after 5 seconds."
          "content": 
            "application/problem+json": 
              "schema": 
                "$ref": "#/components/schemas/Problem"
              "example": 
                "type": "about:blank"
                "title": "Too Many Requests"
                "status": 429
                "detail": "Remove the deterministic lab header or retry after 5 seconds."
                "instance": "/api/v1/products"
                "code": "RATE_LIMITED"
                "fields": []
          "headers": 
            "Retry-After": 
              "description": "Seconds to wait in the deterministic lab."
              "schema": 
                "type": "integer"
                "example": 5
