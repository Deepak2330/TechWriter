            "application/problem+json": 
              "schema": 
                "$ref": "#/components/schemas/Problem"
              "example": 
                "type": "about:blank"
                "title": "Forbidden"
                "status": 403
                "detail": "Use the owning account or the correct role."
                "instance": "/api/v1/products"
                "code": "FORBIDDEN"
                "fields": []
        "404": 
          "description": "The requested resource was not found."
          "content": 
            "application/problem+json": 
              "schema": 
                "$ref": "#/components/schemas/Problem"
              "example": 
                "type": "about:blank"
                "title": "Not Found"
                "status": 404
                "detail": "The requested resource was not found."
                "instance": "/api/v1/products"
                "code": "NOT_FOUND"
                "fields": []
        "409": 
