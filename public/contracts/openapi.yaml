            "application/problem+json": 
              "schema": 
                "$ref": "#/components/schemas/Problem"
              "example": 
                "type": "about:blank"
                "title": "Bad Request"
                "status": 400
                "detail": "Check required fields, data types, and documented limits."
                "instance": "/api/v1/products"
                "code": "INVALID_INPUT"
                "fields": []
        "401": 
          "description": "Select a documented demo bearer token."
          "content": 
            "application/problem+json": 
              "schema": 
                "$ref": "#/components/schemas/Problem"
              "example": 
                "type": "about:blank"
                "title": "Unauthorized"
                "status": 401
                "detail": "Select a documented demo bearer token."
                "instance": "/api/v1/products"
                "code": "UNAUTHENTICATED"
                "fields": []
          "headers": 
            "WWW-Authenticate": 
              "description": "Bearer authentication challenge."
