      "description": "Create a product owned by the seller. Administrators create products for seller_1001. SKUs must be unique.\n\nAccess: Seller. All unknown request properties are rejected. Demo data resets on server restart. Error examples are illustrative envelopes for the documented category, not captured failed requests. Exact detail and fields depend on the failing condition."
