            - "type": "null"
        "availability": 
          "type": "string"
          "description": "Whether the demo accepts new cart additions."
          "enum": 
            - "IN_STOCK"
            - "OUT_OF_STOCK"
        "categoryId": 
          "type": "string"
          "description": "Existing category ID; see GET /categories."
      "required": []
      "additionalProperties": false
      "minProperties": 1
