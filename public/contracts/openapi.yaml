                "description": "A two metre charging cable."
                "priceBeforeMarkdown": null
                "name": "USB-C Cable"
                "sku": "USB-C-02"
                "price": 
                  "amountMinor": 49900
                  "currency": "INR"
                "availability": "IN_STOCK"
